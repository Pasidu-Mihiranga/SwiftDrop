[project]
name = "ai-assistant-service"
version = "0.1.0"
description = "SwiftDrop AI delivery assistant: chat endpoint (OpenAI/Gemini via an OpenAI-compatible client) and an MCP server exposing SwiftDrop tools."
requires-python = ">=3.12"
dependencies = [
    "swiftdrop-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "openai>=2",
    "redis>=6",
    "mcp>=2",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "fakeredis>=2.30",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
]

[tool.uv.sources]
swiftdrop-common = { path = "../../libs/python/swiftdrop_common", editable = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70"
