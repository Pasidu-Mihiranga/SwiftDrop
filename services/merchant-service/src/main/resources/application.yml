# merchant-service — Merchant registration, admin approval workflow and Keycloak client-credentials provisioning.
# Every value can be overridden with an environment variable (12-factor). For local runs the
# repository's .env file is imported, so no secret is ever written here.
spring:
  application:
    name: merchant-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_HOST_PORT:15432}}/${DB_NAME:merchants_db}
    username: ${DB_USER:merchant_svc}
    password: ${DB_PASSWORD:${SWIFTDROP_DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_HOST_PORT:9092}}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: merchant-service
      auto-offset-reset: earliest
      enable-auto-commit: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are issued for the browser-facing URL; keys are fetched over the internal network.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:${KEYCLOAK_HOST_PORT:8180}/realms/swiftdrop}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:${KEYCLOAK_HOST_PORT:8180}/realms/swiftdrop/protocol/openid-connect/certs}
          audiences: swiftdrop-api

server:
  port: ${PORT:8082}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
