# pricing-service — Delivery zones, rate cards and fee quotes (Strategy + Decorator pricing pipeline).
# Every value can be overridden with an environment variable (12-factor). For local runs the
# repository's .env file is imported, so no secret is ever written here.
spring:
  application:
    name: pricing-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_HOST_PORT:15432}}/${DB_NAME:pricing_db}
    username: ${DB_USER:pricing_svc}
    password: ${DB_PASSWORD:${SWIFTDROP_DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      # A quote outlives a deploy: one issued minutes before a release is looked up after it,
      # by a replica running newer code, and during a rolling update by one running older code.
      # Neither may reject a field the other added, so unknown fields are ignored.
      fail-on-unknown-properties: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:${REDIS_HOST_PORT:6380}}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are issued for the browser-facing URL; keys are fetched over the internal network.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:${KEYCLOAK_HOST_PORT:8180}/realms/swiftdrop}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:${KEYCLOAK_HOST_PORT:8180}/realms/swiftdrop/protocol/openid-connect/certs}
          audiences: swiftdrop-api

# Anonymous fee estimates and the public coverage list. The gateway also allows these two
# paths, but the service enforces its own rules, so it has to opt in as well.
swiftdrop:
  security:
    public-paths:
      - /api/v1/pricing/quotes
      - /api/v1/pricing/zones
  pricing:
    quote-ttl: ${PRICING_QUOTE_TTL:PT15M}
    quote-zone-id: ${PRICING_QUOTE_ZONE_ID:Asia/Colombo}

server:
  port: ${PORT:8083}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
