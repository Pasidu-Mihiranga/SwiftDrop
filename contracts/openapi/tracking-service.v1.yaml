openapi: 3.1.0
info:
  title: SwiftDrop tracking-service API
  version: 1.0.0-draft
  description: |
    Tracking read model and real-time updates. Owner — M6.
    WebSocket: Socket.IO at path /ws/tracking (through the gateway). Handshake `auth.token` = access token (optional for
    public rooms). Rooms: `tracking:<trackingNumber>` (public, masked), `user:<sub>` (owner), `dispatch` (staff).
    Server event `parcel.status` carries the same payload as GET /api/v1/tracking/public/{trackingNumber}.
servers: [{ url: http://localhost:8080 }]
paths:
  /api/v1/tracking/public/{trackingNumber}:
    get:
      summary: Public tracking view (no personal data beyond city and masked recipient name)
      security: []
      parameters: [{ name: trackingNumber, in: path, required: true, schema: { type: string, pattern: "^SD[0-9A-Z]{8,20}$" } }]
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  trackingNumber: { type: string }
                  currentStatus: { $ref: "common.v1.yaml#/components/schemas/ParcelStatus" }
                  from: { type: string, example: Colombo }
                  to: { type: string, example: Kandy }
                  recipient: { type: string, example: K*** P. }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        status: { $ref: "common.v1.yaml#/components/schemas/ParcelStatus" }
                        city: { type: string }
                        at: { type: string, format: date-time }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
  /api/v1/tracking/parcels/{parcelId}/timeline:
    get:
      summary: Full timeline for the owner / courier / staff
      security: [{ bearerAuth: [] }]
      parameters: [{ name: parcelId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Timeline }, "404": { $ref: "common.v1.yaml#/components/responses/NotFound" } }
components:
  securitySchemes:
    bearerAuth: { $ref: "common.v1.yaml#/components/securitySchemes/bearerAuth" }
