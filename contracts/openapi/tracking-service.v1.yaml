openapi: 3.1.0
info:
  title: SwiftDrop tracking-service API
  version: 1.0.0-draft
  description: |
    Tracking read model and real-time updates. Owner — M6.
    WebSocket: Socket.IO at path /ws/tracking (through the gateway). Handshake, one of:
      - `auth.ticket`: single-use socket ticket from POST /api/v1/tracking/socket-tickets (60 s, consumed on use).
        Browsers use this; no access token reaches browser JavaScript.
      - `auth.token`: access token (service-to-service or native clients).
      - neither: anonymous, public rooms only.
    Rooms (client sends event `join` with `{ room }` and gets an ack `{ ok }` or `{ ok: false, error: "forbidden" }`):
      - `tracking:<trackingNumber>`: public, masked view, anyone.
      - `user:<sub>`: only the token's own subject.
      - `merchant:<merchantId>`: only when the token carries the matching `merchant_id` claim.
      - `dispatch`: DISPATCHER or ADMIN only.
    Server event `parcel.status` carries the same payload as GET /api/v1/tracking/public/{trackingNumber}.
servers: [{ url: http://localhost:8080 }]
paths:
  /api/v1/tracking/public/{trackingNumber}:
    get:
      summary: Public tracking view (no personal data beyond city and masked recipient name)
      security: []
      parameters: [{ name: trackingNumber, in: path, required: true, schema: { type: string, pattern: "^SD[0-9A-Z]{8,20}$" } }]
      responses:
        "200":
          description: Public view. Contains no phone number and no street address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingView" }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/tracking/parcels/{parcelId}/timeline:
    get:
      summary: Full timeline for the owner / courier / staff
      security: [{ bearerAuth: [] }]
      parameters: [{ name: parcelId, in: path, required: true, schema: { type: string, format: uuid } }]
      description: >-
        Visible to the customer and the assigned courier (ownerIds), the merchant with the matching merchant_id
        claim, and DISPATCHER or ADMIN. Anyone else gets 404, the same answer as for an unknown parcel.
      responses:
        "200":
          description: Timeline of the parcel (same fields as the public view).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingView" }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
  /api/v1/tracking/socket-tickets:
    post:
      summary: Issue a single-use ticket for the Socket.IO handshake (called by the web BFF for the signed-in user)
      security: [{ bearerAuth: [] }]
      description: >-
        The ticket is valid for 60 seconds and is consumed by the first handshake that presents it. The response lists
        the rooms this principal may join, so the client can join them after connecting.
      responses:
        "201":
          description: Ticket issued.
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresIn, rooms]
                properties:
                  ticket: { type: string, description: "Opaque, base64url, 32 random bytes" }
                  expiresIn: { type: integer, example: 60 }
                  rooms: { type: array, items: { type: string }, example: ["user:3f2c0c1e-0000-4000-8000-000000000001"] }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth: { $ref: "common.v1.yaml#/components/securitySchemes/bearerAuth" }
  responses:
    RateLimited:
      description: Too many public lookups from this client address in the current minute.
      headers:
        Retry-After:
          description: Seconds to wait before the next lookup (60).
          schema: { type: integer, example: 60 }
      content:
        application/problem+json:
          schema: { type: object, properties: { code: { type: string, example: RATE_LIMITED } } }
  schemas:
    TrackingView:
      type: object
      required: [trackingNumber, currentStatus, events]
      properties:
        trackingNumber: { type: string, example: SD261020K7Q2M9X }
        currentStatus:
          oneOf:
            - { $ref: "common.v1.yaml#/components/schemas/ParcelStatus" }
            - { type: "null" }
        from: { type: [string, "null"], example: Colombo }
        to: { type: [string, "null"], example: Kandy }
        recipient: { type: [string, "null"], description: Masked recipient name, example: K*** P. }
        events:
          type: array
          description: Status changes, oldest first. City only, never a street address.
          items:
            type: object
            required: [status, at]
            properties:
              status: { $ref: "common.v1.yaml#/components/schemas/ParcelStatus" }
              city: { type: [string, "null"] }
              at: { type: string, format: date-time }
