openapi: 3.1.0
info:
  title: SwiftDrop parcel-service API
  version: 1.0.0-draft
  description: Parcel booking, status lifecycle, proof of delivery, receipts and the merchant order API. Owners — M3 (booking), M4 (status/courier), M7 (merchant orders), M9 (receipts).
servers: [{ url: http://localhost:8080 }]
security: [{ bearerAuth: [] }]
paths:
  /api/v1/parcels:
    post:
      summary: Create a delivery (CUSTOMER) from a confirmed quote
      description: |
        pricing-service is asked for the quote again, so the fee is the quoted one. 422 QUOTE_EXPIRED when the quote
        is unknown or past its validity, 422 QUOTE_MISMATCH when the quote was issued for a different route, 503
        PRICING_UNAVAILABLE when pricing-service cannot be reached (nothing is stored; retrying is safe).
      tags: [Customer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateParcelRequest" }
      responses:
        "201":
          description: Created
          headers:
            Location: { description: "/api/v1/parcels/{parcelId}", schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Parcel" } } }
        "400": { $ref: "common.v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
        "422": { $ref: "common.v1.yaml#/components/responses/UnprocessableContent" }
        "503": { $ref: "common.v1.yaml#/components/responses/ServiceUnavailable" }
  /api/v1/parcels/mine:
    get:
      summary: The caller's parcels, newest first (CUSTOMER)
      description: Page items are summaries without `history`; open one parcel for its history.
      tags: [Customer]
      parameters:
        - $ref: "common.v1.yaml#/components/parameters/Page"
        - $ref: "common.v1.yaml#/components/parameters/Size"
        - { name: status, in: query, schema: { $ref: "common.v1.yaml#/components/schemas/ParcelStatus" } }
      responses:
        "200": { description: Page of parcels, content: { application/json: { schema: { $ref: "#/components/schemas/ParcelPage" } } } }
        "400": { $ref: "common.v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
  /api/v1/parcels/{parcelId}:
    get:
      summary: Parcel details (owner, assigned courier, merchant or staff)
      parameters: [{ $ref: "#/components/parameters/ParcelId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Parcel" } } } }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
  /api/v1/parcels/{parcelId}/cancel:
    post:
      summary: Cancel a parcel that has not been picked up (its owner only)
      description: |
        404 for anyone but the owner, as for a missing id. 422 PARCEL_NOT_CANCELLABLE once the parcel has been picked
        up; 409 PARCEL_MODIFIED when the parcel changed at the same time (reload and try again).
      parameters: [{ $ref: "#/components/parameters/ParcelId" }]
      responses:
        "200": { description: Cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/Parcel" } } } }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
        "409": { $ref: "common.v1.yaml#/components/responses/Conflict" }
        "422": { $ref: "common.v1.yaml#/components/responses/UnprocessableContent" }
  /api/v1/parcels/{parcelId}/receipt:
    get:
      summary: Delivery receipt (PDF)
      parameters: [{ $ref: "#/components/parameters/ParcelId" }]
      responses:
        "200": { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
  /api/v1/courier/parcels/{parcelId}/status:
    patch:
      summary: Courier moves an assigned parcel to its next status
      tags: [Courier]
      parameters: [{ $ref: "#/components/parameters/ParcelId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusUpdateRequest" }
      description: |
        Only the courier the parcel is assigned to (from dispatch's ParcelAssigned), or staff. Another courier
        gets 404, as for a missing parcel. A failed delivery is sent out again by dispatch (reattempt), not by
        the courier. Writes the history row and ParcelStatusChanged in one transaction.
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Parcel" } } } }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
        "422": { description: "INVALID_STATUS_TRANSITION (e.g. CREATED to DELIVERED), FAILURE_REASON_REQUIRED, DELIVERY_PROOF_REQUIRED or PROOF_NOT_FOUND" }
  /api/v1/courier/parcels/{parcelId}/proof-upload-url:
    post:
      summary: Pre-signed URL to upload a proof-of-delivery photo (JPEG/PNG, ≤5 MB)
      description: |
        For the assigned courier (or staff). The phone then PUTs the file straight to `uploadUrl` with the
        same Content-Type, and sends `proofId` in the status update that proves the delivery. Keys are random
        and the bucket is private.
      tags: [Courier]
      parameters: [{ $ref: "#/components/parameters/ParcelId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, sizeBytes]
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png] }
                sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
      responses:
        "200":
          description: Upload instructions
          content:
            application/json:
              schema:
                type: object
                properties:
                  proofId: { type: string }
                  uploadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
        "422": { description: "PROOF_TYPE_NOT_ALLOWED or PROOF_TOO_LARGE" }
  /api/v1/courier/parcels/{parcelId}/proofs/{proofId}:
    get:
      summary: Short-lived link to view a proof-of-delivery file (anyone who may see the parcel)
      tags: [Courier]
      parameters:
        - { $ref: "#/components/parameters/ParcelId" }
        - { name: proofId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Download link
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
  /api/v1/courier/parcels:
    get:
      summary: The parcels assigned to the calling courier, newest first (COURIER)
      tags: [Courier]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "common.v1.yaml#/components/schemas/ParcelStatus" } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ParcelPage" } } } }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
  /api/v1/parcels/{parcelId}/reattempt:
    post:
      summary: Send a failed delivery out again, FAILED to OUT_FOR_DELIVERY (DISPATCHER, ADMIN)
      tags: [Dispatch]
      parameters: [{ $ref: "#/components/parameters/ParcelId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 500 } } }
      responses:
        "200": { description: Sent out again, content: { application/json: { schema: { $ref: "#/components/schemas/Parcel" } } } }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
        "422": { description: "INVALID_STATUS_TRANSITION: the parcel has not failed" }
  /api/v1/merchant/orders:
    post:
      summary: Merchant system creates a delivery order (MERCHANT_API, OAuth2 client credentials)
      description: |
        The merchant is the one in the access token (merchant_id claim); no merchant id is accepted in the path,
        query or body. Only a merchant parcel-service knows as APPROVED may order: it learns merchant status from
        merchant-service's lifecycle events, and an unknown merchant is refused (fail closed). pricing-service
        prices the order inline; weightKg, sizeClass, serviceLevel and codAmount set the fee, and codAmount is not
        stored.

        Idempotency-Key: the first request with a key creates the order (201). Repeating it with the same key and
        the same body returns the same order (200, header Idempotent-Replayed: true) without pricing it again or
        creating anything; concurrent repeats also get the one order. The same key with a different body is 409
        IDEMPOTENCY_KEY_REUSED. A request that was refused (400, 403, 422, 503) stored nothing, so its key may be
        used again.

        Errors: 400 VALIDATION_FAILED or IDEMPOTENCY_KEY_INVALID (missing, or not 8 to 100 visible ASCII
        characters); 403 MERCHANT_NOT_APPROVED or MERCHANT_ID_MISSING; 409 IDEMPOTENCY_KEY_REUSED, or
        IDEMPOTENCY_KEY_IN_PROGRESS when a concurrent request with the key did not finish (retry with the same
        key); 422 with pricing-service's code (e.g. DISTRICT_NOT_SERVICED, SIZE_CLASS_WEIGHT_EXCEEDED); 503
        PRICING_UNAVAILABLE.
      tags: [Merchant API]
      security: [{ keycloak: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "common.v1.yaml#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantOrderRequest" }
      responses:
        "201":
          description: Order created
          headers:
            Location: { description: "/api/v1/parcels/{id}", schema: { type: string } }
          content: { application/json: { schema: { $ref: "#/components/schemas/MerchantOrder" } } }
        "200":
          description: Replay of an earlier request with the same Idempotency-Key and body; nothing new was created
          headers:
            Location: { description: "/api/v1/parcels/{id}", schema: { type: string } }
            Idempotent-Replayed: { description: Always true on a replay, schema: { type: string, enum: ["true"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/MerchantOrder" } } }
        "400": { $ref: "common.v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
        "409": { $ref: "common.v1.yaml#/components/responses/Conflict" }
        "422": { $ref: "common.v1.yaml#/components/responses/UnprocessableContent" }
        "503":
          description: pricing-service could not price the order; nothing was stored, retry with the same key
          content:
            application/problem+json:
              schema: { $ref: "common.v1.yaml#/components/schemas/ProblemDetail" }
    get:
      summary: The caller's merchant's orders, newest first (MERCHANT portal user or MERCHANT_API)
      description: |
        Only the orders of the merchant in the access token; there is no merchant id parameter, so one merchant
        cannot list another's orders. A suspended merchant can still read its history. The filters combine: an
        order must match all of them, and paging counts only matching orders. 403 MERCHANT_ID_MISSING when the
        token names no merchant; 400 INVALID_DATE_RANGE when from is not before to.
      tags: [Merchant API]
      security: [{ keycloak: [] }, { bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "common.v1.yaml#/components/schemas/ParcelStatus" } }
        - name: from
          in: query
          description: Orders created at or after this instant (ISO 8601, e.g. 2026-11-01T00:00:00Z).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Orders created before this instant.
          schema: { type: string, format: date-time }
        - name: orderRef
          in: query
          description: |
            Orders whose merchantOrderRef contains this text, ignoring case (for example "1001" finds "WEB-1001").
            Surrounding spaces are ignored and an empty value means no search. "%" and "_" are matched as
            ordinary characters, not as wildcards. Added in a backwards-compatible way: clients that do not send
            it are unaffected.
          schema: { type: string, maxLength: 100, example: WEB-1001 }
        - $ref: "common.v1.yaml#/components/parameters/Page"
        - $ref: "common.v1.yaml#/components/parameters/Size"
      responses:
        "200": { description: Page of orders, content: { application/json: { schema: { $ref: "#/components/schemas/MerchantOrderPage" } } } }
        "400": { $ref: "common.v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
  /api/v1/parcels/meta/whoami:
    get:
      summary: Smoke test (gateway → service → JWT)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "common.v1.yaml#/components/schemas/WhoAmI" } } } }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth: { $ref: "common.v1.yaml#/components/securitySchemes/bearerAuth" }
    keycloak: { $ref: "common.v1.yaml#/components/securitySchemes/keycloak" }
  parameters:
    ParcelId:
      name: parcelId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Contact:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, maxLength: 100 }
        phone: { type: string, pattern: "^(\\+94|0)7[0-9]{8}$" }
        email: { type: string, format: email }
    CreateParcelRequest:
      type: object
      required: [quoteId, pickup, dropoff, recipient]
      properties:
        quoteId: { type: string, format: uuid, description: From POST /api/v1/pricing/quotes (valid 15 min) }
        pickup: { $ref: "common.v1.yaml#/components/schemas/Address" }
        dropoff: { $ref: "common.v1.yaml#/components/schemas/Address" }
        recipient: { $ref: "#/components/schemas/Contact" }
        notes: { type: string, maxLength: 300 }
    MerchantOrderRequest:
      type: object
      description: There is no merchant id field; any merchantId sent is ignored.
      required: [merchantOrderRef, pickup, dropoff, recipient, weightKg, sizeClass]
      properties:
        merchantOrderRef: { type: string, minLength: 1, maxLength: 100, description: The merchant's own order number. }
        pickup: { $ref: "common.v1.yaml#/components/schemas/Address" }
        dropoff: { $ref: "common.v1.yaml#/components/schemas/Address" }
        recipient: { $ref: "#/components/schemas/Contact" }
        weightKg: { type: number, exclusiveMinimum: 0, maximum: 100 }
        sizeClass: { $ref: "common.v1.yaml#/components/schemas/SizeClass" }
        serviceLevel: { type: string, enum: [STANDARD, EXPRESS, SAME_DAY], default: STANDARD }
        codAmount: { type: number, minimum: 0, description: Cash to collect; it changes the fee and is not stored. }
    MerchantOrder:
      description: A parcel created through the merchant order API.
      allOf:
        - { $ref: "#/components/schemas/Parcel" }
        - type: object
          required: [id, trackingNumber, status, source, merchantOrderRef, pickup, dropoff, recipient, weightKg,
                     sizeClass, fee, createdAt]
          properties:
            source: { const: MERCHANT }
            merchantOrderRef: { type: string, minLength: 1 }
            serviceLevel: { type: string, enum: [STANDARD, EXPRESS, SAME_DAY] }
    MerchantOrderPage:
      type: object
      required: [content, page]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/MerchantOrder" } }
        page:
          allOf:
            - { $ref: "common.v1.yaml#/components/schemas/PageMeta" }
            - { required: [page, size, totalElements, totalPages] }
    StatusUpdateRequest:
      type: object
      required: [toStatus]
      properties:
        toStatus: { $ref: "common.v1.yaml#/components/schemas/ParcelStatus" }
        note: { type: string, maxLength: 500 }
        failureReason: { type: string, enum: [RECIPIENT_UNAVAILABLE, WRONG_ADDRESS, REFUSED, DAMAGED, OTHER] }
        proof:
          type: object
          properties:
            type: { type: string, enum: [NAME, PHOTO, SIGNATURE] }
            receivedBy: { type: string, maxLength: 100 }
            proofId: { type: string }
        location: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
    StatusHistoryEntry:
      type: object
      properties:
        fromStatus: { $ref: "common.v1.yaml#/components/schemas/ParcelStatus" }
        toStatus: { $ref: "common.v1.yaml#/components/schemas/ParcelStatus" }
        note: { type: string }
        failureReason: { type: string }
        actorRole: { type: string }
        occurredAt: { type: string, format: date-time }
    Parcel:
      type: object
      description: Fields without a value are left out of the JSON (e.g. merchantOrderRef on customer parcels, courierId before assignment, history in page items).
      properties:
        id: { type: string, format: uuid }
        trackingNumber: { type: string, example: SD261020K7Q2M9X }
        status: { $ref: "common.v1.yaml#/components/schemas/ParcelStatus" }
        source: { type: string, enum: [CUSTOMER, MERCHANT] }
        merchantOrderRef: { type: string }
        pickup: { $ref: "common.v1.yaml#/components/schemas/Address" }
        dropoff: { $ref: "common.v1.yaml#/components/schemas/Address" }
        recipient: { $ref: "#/components/schemas/Contact" }
        weightKg: { type: number }
        sizeClass: { $ref: "common.v1.yaml#/components/schemas/SizeClass" }
        serviceLevel: { type: string, enum: [STANDARD, EXPRESS, SAME_DAY] }
        fee: { $ref: "common.v1.yaml#/components/schemas/Money" }
        notes: { type: string, maxLength: 300 }
        courierId: { type: [string, "null"] }
        history: { type: array, items: { $ref: "#/components/schemas/StatusHistoryEntry" } }
        createdAt: { type: string, format: date-time }
    ParcelPage:
      type: object
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/Parcel" } }
        page: { $ref: "common.v1.yaml#/components/schemas/PageMeta" }
