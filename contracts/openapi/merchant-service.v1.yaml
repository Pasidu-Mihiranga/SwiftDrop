openapi: 3.1.0
info:
  title: SwiftDrop merchant-service API
  version: 1.0.0-draft
  description: |
    Merchant registration, admin approval and API credentials (Keycloak client credentials). Owner — M7.

    Lifecycle: PENDING -> APPROVED or REJECTED, APPROVED -> SUSPENDED. REJECTED and SUSPENDED are final.
    Every change publishes MerchantLifecycleChanged (contracts/events/merchant-lifecycle.v1.schema.json).
    A user whose application was rejected may apply again; the rejected application is kept.
servers: [{ url: http://localhost:8080 }]
security: [{ bearerAuth: [] }]
paths:
  /api/v1/merchants/register:
    post:
      summary: Apply to become a merchant (any signed-in person; not a merchant API client)
      description: |
        The applicant is the caller. Returns 409 MERCHANT_APPLICATION_EXISTS when the caller already has an
        application that is not rejected, and 409 MERCHANT_BR_NUMBER_TAKEN when another application that is not
        rejected uses the same business registration number (compared upper case, without spaces).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterMerchantRequest" }
      responses:
        "201":
          description: Application created (status PENDING)
          headers:
            Location: { description: /api/v1/merchants/me, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400": { $ref: "common.v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
        "409": { $ref: "common.v1.yaml#/components/responses/Conflict" }
  /api/v1/merchants/me:
    get:
      summary: The caller's latest application and its status, including a rejection reason
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
  /api/v1/merchants/me/credentials/rotate:
    post:
      summary: Issue a new client secret (shown once)
      responses:
        "200":
          description: New credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientId: { type: string }
                  clientSecret: { type: string }
                  tokenUrl: { type: string, format: uri }
  /api/v1/admin/merchants:
    get:
      summary: A page of merchant applications in one status, oldest first (ADMIN)
      parameters:
        - name: status
          in: query
          description: Defaults to PENDING, the approval queue.
          schema: { $ref: "#/components/schemas/MerchantStatus", default: PENDING }
        - $ref: "common.v1.yaml#/components/parameters/Page"
        - $ref: "common.v1.yaml#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantPage" }
        "400": { $ref: "common.v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
  /api/v1/admin/merchants/{merchantId}/approve:
    post:
      summary: Approve a PENDING application (ADMIN) — publishes MerchantLifecycleChanged
      parameters: [{ $ref: "#/components/parameters/MerchantId" }]
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
        "409": { $ref: "common.v1.yaml#/components/responses/Conflict" }
        "422": { $ref: "common.v1.yaml#/components/responses/UnprocessableContent" }
  /api/v1/admin/merchants/{merchantId}/reject:
    post:
      summary: Reject a PENDING application with a reason the applicant can read (ADMIN)
      parameters: [{ $ref: "#/components/parameters/MerchantId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Surrounding whitespace is removed; the remaining text must be 1 to 500 characters.
                  pattern: "\\S"
                  maxLength: 500
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "400": { $ref: "common.v1.yaml#/components/responses/BadRequest" }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
        "409": { $ref: "common.v1.yaml#/components/responses/Conflict" }
        "422": { $ref: "common.v1.yaml#/components/responses/UnprocessableContent" }
  /api/v1/admin/merchants/{merchantId}/suspend:
    post:
      summary: Suspend an APPROVED merchant (ADMIN) — its API orders are refused once the event is consumed
      parameters: [{ $ref: "#/components/parameters/MerchantId" }]
      responses:
        "200":
          description: Suspended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Merchant" }
        "401": { $ref: "common.v1.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "common.v1.yaml#/components/responses/Forbidden" }
        "404": { $ref: "common.v1.yaml#/components/responses/NotFound" }
        "409": { $ref: "common.v1.yaml#/components/responses/Conflict" }
        "422": { $ref: "common.v1.yaml#/components/responses/UnprocessableContent" }
components:
  securitySchemes:
    bearerAuth: { $ref: "common.v1.yaml#/components/securitySchemes/bearerAuth" }
  parameters:
    MerchantId:
      name: merchantId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    MerchantStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, SUSPENDED]
    PickupAddress:
      type: object
      description: The shared Address schema without coordinates. Encrypted at rest.
      required: [line1, city, district]
      properties:
        line1: { type: string, maxLength: 120 }
        line2: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 60, example: Kandy }
        district: { type: string, maxLength: 40, example: Kandy }
        postalCode: { type: string, pattern: "^[0-9]{5}$" }
    RegisterMerchantRequest:
      type: object
      required: [businessName, brNumber, contactEmail, contactPhone, pickupAddress]
      properties:
        businessName: { type: string, minLength: 1, maxLength: 150 }
        brNumber:
          type: string
          description: Business registration number. Stored upper case without spaces.
          maxLength: 30
          pattern: "^[A-Za-z0-9 /-]+$"
          example: PV 12345
        contactEmail: { type: string, format: email, maxLength: 254 }
        contactPhone:
          type: string
          description: Sri Lankan mobile or landline number. Encrypted at rest.
          pattern: "^(\\+94|0)[1-9][0-9]{8}$"
          example: "0771234567"
        website: { type: string, format: uri, maxLength: 255, pattern: "^https?://\\S+$" }
        pickupAddress: { $ref: "#/components/schemas/PickupAddress" }
    Merchant:
      type: object
      description: A merchant application, as shown to its applicant and to admins.
      required: [id, businessName, brNumber, contactEmail, contactPhone, pickupAddress, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        businessName: { type: string }
        brNumber: { type: string, example: PV12345 }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string }
        website: { type: string, format: uri }
        pickupAddress: { $ref: "#/components/schemas/PickupAddress" }
        status: { $ref: "#/components/schemas/MerchantStatus" }
        rejectionReason: { type: string, description: Present only when REJECTED. }
        reviewedAt: { type: string, format: date-time, description: When the latest decision was made. }
        createdAt: { type: string, format: date-time }
    MerchantPage:
      type: object
      required: [content, page]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/Merchant" } }
        page: { $ref: "common.v1.yaml#/components/schemas/PageMeta" }
