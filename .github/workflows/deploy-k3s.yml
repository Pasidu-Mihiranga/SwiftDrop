name: CD · deploy changed services

# CD runs for deploy/k3s-two-node and for main. CI workflows run on every branch.
# The runner SSHs to the apps node and that node rebuilds only the services
# whose files changed on the branch that was pushed. The private key stays in
# the SWIFTDROP_SSH_KEY secret. Port 22 on the apps node is open for this demo.
# The data node is not.

on:
  push:
    branches: [main, deploy/k3s-two-node]

concurrency:
  group: deploy-k3s
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy only after CI for this commit succeeds
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          deploy=false
          previous_ids=""
          stable=0
          for _ in $(seq 1 160); do
            json="$(gh run list --repo "${{ github.repository }}" --commit "$sha" --limit 50 \
              --json databaseId,name,status,conclusion,event)"
            output="$(printf '%s' "$json" | python3 scripts/ci-deploy-gate.py)"
            result="$(printf '%s\n' "$output" | sed -n '1p')"
            ids="$(printf '%s\n' "$output" | sed -n '2p')"
            echo "CI status: ${result} (${ids:-none})"
            if [ "$result" = "failed" ]; then
              echo "CI failed, so this deploy is skipped."
              break
            fi
            if [ "$result" = "success" ] && [ -n "$ids" ] && [ "$ids" = "$previous_ids" ]; then
              stable=$((stable + 1))
            else
              stable=0
            fi
            previous_ids="$ids"
            # Two matching completed polls mean a late CI run did not appear.
            if [ "$stable" -ge 2 ]; then
              deploy=true
              break
            fi
            sleep 30
          done
          if [ "$deploy" = "false" ]; then
            echo "CI did not succeed, so this deploy is skipped."
          fi
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Update changed containers
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SWIFTDROP_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "Add the apps-node private key as the SWIFTDROP_SSH_KEY repository secret."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/swiftdrop.pem
          chmod 600 ~/.ssh/swiftdrop.pem
          branch="${{ github.ref_name }}"
          case "${branch}" in
            main|deploy/k3s-two-node) ;;
            *) echo "Refusing to deploy ${branch}." >&2; exit 1 ;;
          esac
          ssh -i ~/.ssh/swiftdrop.pem \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            ubuntu@52.62.242.130 \
            "sudo SWIFTDROP_BRANCH='${branch}' /usr/local/bin/swiftdrop-watch-deploy.sh"
