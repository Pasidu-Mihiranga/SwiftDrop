name: CD · deploy changed services

# CD runs only for deploy/k3s-two-node. CI workflows run on every branch.
# The runner SSHs to the apps node and that node rebuilds only the services
# whose files changed. The private key stays in the SWIFTDROP_SSH_KEY secret.
# Port 22 on the apps node is open for this demo. The data node is not.

on:
  push:
    branches: [deploy/k3s-two-node]

concurrency:
  group: deploy-k3s
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Update changed containers
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SWIFTDROP_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "Add the apps-node private key as the SWIFTDROP_SSH_KEY repository secret."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/swiftdrop.pem
          chmod 600 ~/.ssh/swiftdrop.pem
          ssh -i ~/.ssh/swiftdrop.pem \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            ubuntu@3.111.117.223 \
            'sudo /usr/local/bin/swiftdrop-watch-deploy.sh'
