name: CI · Node services & web

on:
  push:
    branches: [main]
    paths: ["libs/node/**", "services/*-service/package.json", "services/*-service/src/**/*.ts", "services/*-service/test/**", "apps/web/**", "contracts/events/**", "pnpm-lock.yaml", "tsconfig.base.json", ".github/workflows/ci-node.yml"]
  pull_request:
    paths: ["libs/node/**", "services/*-service/package.json", "services/*-service/src/**/*.ts", "services/*-service/test/**", "apps/web/**", "contracts/events/**", "pnpm-lock.yaml", "tsconfig.base.json", ".github/workflows/ci-node.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck · test (coverage ≥70%) · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: |
            libs/node/*/coverage/
            services/*/coverage/
            apps/web/coverage/
          retention-days: 14
