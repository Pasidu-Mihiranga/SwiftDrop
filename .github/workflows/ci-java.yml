name: CI · Java services

on:
  push:
    branches: [main]
    paths: ["pom.xml", "libs/java/**", "services/api-gateway/**", "services/*-service/pom.xml", "services/*-service/src/main/java/**", "services/*-service/src/test/java/**", "services/*-service/src/main/resources/**", "contracts/events/**", ".github/workflows/ci-java.yml"]
  pull_request:
    paths: ["pom.xml", "libs/java/**", "services/api-gateway/**", "services/*-service/pom.xml", "services/*-service/src/main/java/**", "services/*-service/src/test/java/**", "services/*-service/src/main/resources/**", "contracts/events/**", ".github/workflows/ci-java.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify (unit + Testcontainers + JaCoCo ≥70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and enforce coverage
        run: mvn -B -ntp verify
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
          retention-days: 14
