name: CI · Python (AI assistant)

on:
  push:
    branches: [main]
    paths: ["libs/python/**", "services/ai-assistant-service/**", ".github/workflows/ci-python.yml"]
  pull_request:
    paths: ["libs/python/**", "services/ai-assistant-service/**", ".github/workflows/ci-python.yml"]

jobs:
  test:
    name: pytest (coverage ≥70%)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [libs/python/swiftdrop_common, services/ai-assistant-service]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ strategy.job-index }}
          path: ${{ matrix.project }}/coverage.xml
