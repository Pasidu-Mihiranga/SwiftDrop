name: CI · Trivy

# Fails the build, and therefore the k3s deploy gate, when:
#   - a dependency in the repo has a CRITICAL vulnerability that already has a fix, or
#   - a secret is committed, or
#   - a pinned runtime image has a CRITICAL vulnerability that already has a fix.
# The same rule as release.yml. Unfixed findings and HIGH findings are reported by Trivy
# locally but do not fail this gate. Accepted ids go in .trivyignore with a reason.
# License and configuration checks are left out: they flag style, not a known exploit.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Trivy reads Java dependencies from the local Maven cache. Without this step it asks
      # Maven Central for every POM and the scan fails when that host rate-limits the runner.
      # install, not dependency:resolve: later modules need the jars this reactor just built.
      - name: Fill the Maven cache
        run: mvn -B -ntp -DskipTests install

      - name: Fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.76.1
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: table
          cache: true

      - name: Committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.76.1
          scanners: secret
          exit-code: "1"
          format: table

  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runtime bases of the images this repo builds.
          - { name: jre, ref: "eclipse-temurin:21-jre" }
          - { name: node, ref: "node:22.20.0-alpine" }
          - { name: python, ref: "python:3.12-slim" }
          # Images the cluster runs as-is. Tags match infra/helm/swiftdrop/values.yaml.
          - { name: postgres, ref: "postgres:16.15-alpine" }
          - { name: redis, ref: "redis:7.4.11-alpine" }
          - { name: kafka, ref: "apache/kafka:4.1.2" }
          - { name: mongodb, ref: "mongo:7.0.45" }
          - { name: object-storage, ref: "rustfs/rustfs:1.0.3" }
          - { name: mailpit, ref: "axllent/mailpit:v1.32.0" }
          - { name: keycloak, ref: "quay.io/keycloak/keycloak:26.8.1" }
    steps:
      - uses: actions/checkout@v7

      - name: Fixable critical vulnerabilities in ${{ matrix.ref }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.ref }}
          version: v0.76.1
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
          format: table
          cache: true
