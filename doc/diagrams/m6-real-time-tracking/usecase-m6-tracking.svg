<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860"><defs><marker id="fill" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="10" markerHeight="8" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#000"/></marker><marker id="open" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="10" markerHeight="8" orient="auto"><path d="M0,0 L12,5 L0,10" fill="none" stroke="#000" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="20.0" y="34.0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#000">usecase-m6-tracking</text><g transform="translate(0,56)"><rect x="330" y="40" width="800" height="700" rx="0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="345.0" y="64.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#000">SwiftDrop · tracking-service (M6)</text><rect x="370" y="100" width="330" height="58" rx="29.0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="535.0" y="127.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Track a parcel by number</text><text x="535.0" y="144.0" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#000">GET /api/v1/tracking/public/{no}</text><rect x="760" y="100" width="330" height="58" rx="29.0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="925.0" y="127.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Limit public lookups</text><text x="925.0" y="144.0" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#000">rate limit per IP (enumeration)</text><rect x="370" y="190" width="330" height="58" rx="29.0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="535.0" y="217.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Follow one parcel live</text><text x="535.0" y="234.0" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#000">join room tracking:{no}</text><rect x="370" y="390" width="330" height="58" rx="29.0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="535.0" y="417.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">View full timeline of own parcel</text><text x="535.0" y="434.0" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#000">GET .../parcels/{id}/timeline</text><rect x="370" y="480" width="330" height="58" rx="29.0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="535.0" y="507.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Receive live status toasts</text><text x="535.0" y="524.0" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#000">room user:{sub}</text><rect x="370" y="570" width="330" height="58" rx="29.0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="535.0" y="597.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Watch the live dispatcher board</text><text x="535.0" y="614.0" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#000">room dispatch (staff only)</text><rect x="370" y="650" width="330" height="58" rx="29.0" fill="#fff" stroke="#000" stroke-width="1.2"/><text x="535.0" y="677.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Project parcel events into timelines</text><text x="535.0" y="694.0" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="normal" text-anchor="middle" fill="#000">consume parcel.* (idempotent)</text><path d="M700,129 L760,129" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open)"/><text x="730.0" y="121.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#000">«include»</text><path d="M535,190 L535,158" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#open)"/><text x="545.0" y="180.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#000">«extend»</text><circle cx="150" cy="110" r="9" fill="#fff" stroke="#000" stroke-width="1.3"/><path d="M150,119 L150,142" fill="none" stroke="#000" stroke-width="1.3"/><path d="M135,127 L165,127" fill="none" stroke="#000" stroke-width="1.3"/><path d="M150,142 L138,160" fill="none" stroke="#000" stroke-width="1.3"/><path d="M150,142 L162,160" fill="none" stroke="#000" stroke-width="1.3"/><text x="150.0" y="178.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#000">Guest</text><circle cx="150" cy="260" r="9" fill="#fff" stroke="#000" stroke-width="1.3"/><path d="M150,269 L150,292" fill="none" stroke="#000" stroke-width="1.3"/><path d="M135,277 L165,277" fill="none" stroke="#000" stroke-width="1.3"/><path d="M150,292 L138,310" fill="none" stroke="#000" stroke-width="1.3"/><path d="M150,292 L162,310" fill="none" stroke="#000" stroke-width="1.3"/><text x="150.0" y="328.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#000">Customer</text><circle cx="150" cy="410" r="9" fill="#fff" stroke="#000" stroke-width="1.3"/><path d="M150,419 L150,442" fill="none" stroke="#000" stroke-width="1.3"/><path d="M135,427 L165,427" fill="none" stroke="#000" stroke-width="1.3"/><path d="M150,442 L138,460" fill="none" stroke="#000" stroke-width="1.3"/><path d="M150,442 L162,460" fill="none" stroke="#000" stroke-width="1.3"/><text x="150.0" y="478.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#000">Merchant</text><circle cx="150" cy="560" r="9" fill="#fff" stroke="#000" stroke-width="1.3"/><path d="M150,569 L150,592" fill="none" stroke="#000" stroke-width="1.3"/><path d="M135,577 L165,577" fill="none" stroke="#000" stroke-width="1.3"/><path d="M150,592 L138,610" fill="none" stroke="#000" stroke-width="1.3"/><path d="M150,592 L162,610" fill="none" stroke="#000" stroke-width="1.3"/><text x="150.0" y="628.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#000">Dispatcher / Admin</text><path d="M166,127 L370,129" fill="none" stroke="#000" stroke-width="1.2"/><path d="M166,127 L370,219" fill="none" stroke="#000" stroke-width="1.2"/><path d="M166,277 L370,129" fill="none" stroke="#000" stroke-width="1.2"/><path d="M166,277 L370,419" fill="none" stroke="#000" stroke-width="1.2"/><path d="M166,277 L370,509" fill="none" stroke="#000" stroke-width="1.2"/><path d="M166,427 L370,419" fill="none" stroke="#000" stroke-width="1.2"/><path d="M166,427 L370,509" fill="none" stroke="#000" stroke-width="1.2"/><path d="M166,577 L370,419" fill="none" stroke="#000" stroke-width="1.2"/><path d="M166,577 L370,599" fill="none" stroke="#000" stroke-width="1.2"/><rect x="1190" y="636" width="220" height="64" rx="6" fill="#fff" stroke="#000" stroke-width="1.2" stroke-dasharray="6,4"/><text x="1300.0" y="663.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">parcel-service</text><text x="1300.0" y="681.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#000">event source (Kafka)</text><path d="M700,679 L1190,679" fill="none" stroke="#000" stroke-width="1.2"/><text x="945.0" y="671.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#000">events</text><circle cx="1300" cy="450" r="9" fill="#fff" stroke="#000" stroke-width="1.3"/><path d="M1300,459 L1300,482" fill="none" stroke="#000" stroke-width="1.3"/><path d="M1285,467 L1315,467" fill="none" stroke="#000" stroke-width="1.3"/><path d="M1300,482 L1288,500" fill="none" stroke="#000" stroke-width="1.3"/><path d="M1300,482 L1312,500" fill="none" stroke="#000" stroke-width="1.3"/><text x="1300.0" y="518.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#000">Courier</text><path d="M1300,530 L1300,636" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#fill)"/><text x="1310.0" y="585.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#000">status updates</text><text x="40.0" y="690.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#000">Customers, merchants and guests read tracking data.</text><text x="40.0" y="708.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#000">Couriers have no tracking use case: their updates are the data.</text><text x="40.0" y="726.0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#000">«include» / «extend» dashed arrows follow UML direction.</text></g></svg>