<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 1144" width="1190" height="1144" role="img" aria-label="M8 use cases: webhooks"><defs><marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111111"/></marker><marker id="o" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0.5 0.5 L9.5 5 L0.5 9.5 z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/></marker><marker id="v" viewBox="0 0 10 10" refX="9.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9.4 5 L1 9" fill="none" stroke="#111111" stroke-width="1.2"/></marker><marker id="one" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M8 2 V14 M12 2 V14" fill="none" stroke="#111111" stroke-width="1.3"/></marker><marker id="many" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M8 8 L16 1 M8 8 L16 8 M8 8 L16 15" fill="none" stroke="#111111" stroke-width="1.3"/><circle cx="4" cy="8" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.3"/></marker><marker id="zeroone" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M12 2 V14" fill="none" stroke="#111111" stroke-width="1.3"/><circle cx="5" cy="8" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.3"/></marker><marker id="od" viewBox="0 0 22 12" refX="21.5" refY="6" markerWidth="22" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5 6 L11 0.7 L21.5 6 L11 11.3 z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/></marker><marker id="fd" viewBox="0 0 22 12" refX="21.5" refY="6" markerWidth="22" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0.5 6 L11 0.7 L21.5 6 L11 11.3 z" fill="#111111" stroke="#111111" stroke-width="1.2"/></marker></defs><rect width="1190" height="1144" fill="#ffffff"/><rect x="340" y="60" width="540" height="1064" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="610.0" y="84.0" font-size="12.5" font-weight="600" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">SwiftDrop webhooks (M8)  ·  web app + webhook-service  ·  system boundary</text><rect x="360" y="110" width="500" height="416" rx="4" fill="#ececec" stroke="#d4d4d4" stroke-width="1"/><text x="374.0" y="126.0" font-size="11" font-weight="500" fill="#6b6b6b" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" letter-spacing="1.6">MERCHANT  ·  SCOPED BY MERCHANT_ID</text><rect x="400" y="154" width="420" height="52" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="610.0" y="172.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Register a webhook endpoint</text><text x="610.0" y="190.0" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">URL + event types, SSRF checks</text><rect x="400" y="230" width="420" height="52" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="610.0" y="248.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Reveal the signing secret once</text><text x="610.0" y="266.0" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">encrypted at rest afterwards</text><rect x="400" y="306" width="420" height="52" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="610.0" y="324.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Send a signed test ping</text><text x="610.0" y="342.0" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">POST /endpoints/{id}/test</text><rect x="400" y="382" width="420" height="52" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="610.0" y="400.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">List and remove endpoints</text><text x="610.0" y="418.0" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">GET, DELETE /endpoints</text><rect x="400" y="458" width="420" height="52" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="610.0" y="476.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">View the delivery log</text><text x="610.0" y="494.0" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">attempts, response codes, next retry</text><rect x="360" y="546" width="500" height="188" rx="4" fill="#ececec" stroke="#d4d4d4" stroke-width="1"/><text x="374.0" y="562.0" font-size="11" font-weight="500" fill="#6b6b6b" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" letter-spacing="1.6">ADMIN ONLY</text><rect x="400" y="590" width="420" height="52" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="610.0" y="608.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">List dead-lettered deliveries</text><text x="610.0" y="626.0" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">GET /admin/webhooks/deliveries?status=DEAD</text><rect x="400" y="666" width="420" height="52" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="610.0" y="684.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Replay a dead-lettered delivery</text><text x="610.0" y="702.0" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">POST .../{id}/replay</text><rect x="360" y="754" width="500" height="340" rx="4" fill="#ececec" stroke="#d4d4d4" stroke-width="1"/><text x="374.0" y="770.0" font-size="11" font-weight="500" fill="#6b6b6b" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" letter-spacing="1.6">AUTOMATIC  ·  DRIVEN BY KAFKA EVENTS</text><rect x="400" y="798" width="420" height="52" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="610.0" y="816.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Deliver a signed parcel update</text><text x="610.0" y="834.0" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">parcel.created, parcel.status_changed</text><rect x="400" y="874" width="420" height="52" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="610.0" y="892.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Retry with exponential backoff</text><text x="610.0" y="910.0" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">30 s, 2 m, 10 m, 30 m, 2 h, 6 h</text><rect x="400" y="950" width="420" height="52" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="610.0" y="968.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Dead-letter after the last attempt</text><text x="610.0" y="986.0" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">status DEAD + Kafka event</text><rect x="400" y="1026" width="420" height="52" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="610.0" y="1044.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Pause a suspended merchant</text><text x="610.0" y="1062.0" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">MerchantLifecycleChanged</text><circle cx="100" cy="332.0" r="11" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><path d="M100 343.0 V367.0 M84 351.0 H116 M100 367.0 l-13 18 M100 367.0 l13 18" fill="none" stroke="#111111" stroke-width="1.4" stroke-linecap="round"/><text x="100.0" y="395.0