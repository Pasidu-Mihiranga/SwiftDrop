oe UI, Helvetica Neue, Helvetica, Arial, sans-serif">5. forward</text><text x="1055.0" y="337.9" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">(JWT valid, rate limit per client)</text><rect x="968.3" y="362.7" width="173.5" height="37.0" fill="#ffffff"/><text x="1055.0" y="373.4" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">6. 201 parcel; the same key</text><text x="1055.0" y="389.0" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">returns the same parcel</text><path d="M1208.2 422.2 H1429.8 L1441.8 434.2 V481.2 H1208.2 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><path d="M1429.8 422.2 V434.2 H1441.8" fill="none" stroke="#111111" stroke-width="1.2"/><text x="1325.0" y="436.9" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">ParcelCreated reaches</text><text x="1325.0" y="451.7" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">webhook-service over Kafka</text><text x="1325.0" y="466.6" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">(see sequence-m8-signed-delivery)</text><rect x="1256.2" y="489.2" width="137.6" height="37.0" fill="#ffffff"/><text x="1325.0" y="500.0" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">7. POST /webhooks,</text><text x="1325.0" y="515.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">signed parcel.created</text><rect x="431.3" y="607.1" width="167.5" height="37.0" fill="#ffffff"/><text x="515.0" y="617.9" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">8. 503: webhook-service</text><text x="515.0" y="633.4" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">retries, then dead-letters</text><rect x="432.0" y="709.0" width="191.4" height="52.6" fill="#ffffff"/><text x="438.0" y="719.8" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">9. recompute HMAC over the raw</text><text x="438.0" y="735.3" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">body; constant-time</text><text x="438.0" y="750.8" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">compare; t within 5 minutes</text><rect x="395.4" y="836.4" width="239.2" height="21.5" fill="#ffffff"/><text x="515.0" y="847.2" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">10. 400; shown as rejected on the page</text><rect x="432.0" y="927.3" width="185.4" height="37.0" fill="#ffffff"/><text x="438.0" y="938.1" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">11. keep the event in memory,</text><text x="438.0" y="953.6" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">de-duplicated by id</text><rect x="488.1" y="972.3" width="53.9" height="21.5" fill="#ffffff"/><text x="515.0" y="983.1" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">12. 200</text><rect x="131.4" y="1018.3" width="227.3" height="21.5" fill="#ffffff"/><text x="245.0" y="1029.1" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">13. page lists the event as verified</text><rect x="50.0" y="777.6" width="1446.0" height="284.3" fill="none" stroke="#111111" stroke-width="1.2"/><path d="M50.0 797.6 H84.0 L94.0 787.6 V777.6" fill="none" stroke="#111111" stroke-width="1.2"/><text x="68.0" y="787.6" font-size="11.5" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">alt</text><line x1="50.0" y1="880.0" x2="1496.0" y2="880.0" stroke="#111111" stroke-width="1" stroke-dasharray="6 4"/><rect x="153.2" y="801.6" width="183.6" height="20.9" fill="#ffffff"/><text x="245.0" y="812.0" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">[signature wrong or t too old]</text><rect x="219.0" y="888.0" width="52.0" height="20.9" fill="#ffffff"/><text x="245.0" y="898.4" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">[valid]</text><rect x="38.0" y="548.3" widt