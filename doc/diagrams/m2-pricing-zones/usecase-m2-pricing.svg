ont-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">GET /api/v1/pricing/zones</text><rect x="460" y="240" width="400" height="60" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="660.0" y="262.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Request a fee estimate</text><text x="660.0" y="281.0" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">POST /api/v1/pricing/quotes</text><rect x="460" y="330" width="400" height="60" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="660.0" y="352.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">See the itemised fee breakdown</text><text x="660.0" y="371.0" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">BASE / WEIGHT / SIZE / EXPRESS / COD</text><rect x="460" y="470" width="400" height="60" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="660.0" y="492.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Validate an issued quote</text><text x="660.0" y="511.0" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">GET /api/v1/pricing/quotes/{quoteId}</text><rect x="460" y="610" width="400" height="60" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="660.0" y="640.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Create or update a zone</text><rect x="460" y="690" width="400" height="60" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="660.0" y="720.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Assign a district to a zone</text><rect x="460" y="770" width="400" height="60" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="660.0" y="800.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Publish a new rate card</text><rect x="460" y="890" width="400" height="60" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="660.0" y="920.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Close the rate card in force</text><rect x="460" y="970" width="400" height="60" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="660.0" y="1000.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Review size-class limits and multipliers</text><rect x="460" y="1050" width="400" height="60" rx="26" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="660.0" y="1080.0" font-size="13" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Update a size class</text><circle cx="110" cy="206.0" r="11" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><path d="M110 217.0 V241.0 M94 225.0 H126 M110 241.0 l-13 18 M110 241.0 l13 18" fill="none" stroke="#111111" stroke-width="1.4" stroke-line