, sans-serif">before accepting a booking</text><rect x="1348.24" y="640" width="190" height="80" fill="#ffffff" stroke="#111111" stroke-width="1.4" stroke-dasharray="5 4"/><text x="1443.2" y="662.0" font-size="13" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Kafka broker</text><text x="1443.2" y="679.0" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">publish / subscribe</text><path d="M1293.2 230.0 L1293.2 270.0 L1443.2 270.0 L1443.2 640.0" fill="none" stroke="#111111" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="1445.2" y="432.1" width="177.9" height="35.7" fill="#ffffff"/><text x="1451.2" y="442.6" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">7 · not used</text><text x="1451.2" y="457.4" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">pricing publishes no events</text></svg>