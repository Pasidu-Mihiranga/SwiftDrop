ke="#111111" stroke-width="1"/><line x1="915.0" y1="84.0" x2="915.0" y2="780.0" stroke="#9a9a9a" stroke-width="1.1" stroke-dasharray="7 6"/><rect x="820.0" y="40.0" width="190" height="44" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="915.0" y="67.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">Redis</text><line x1="898.5" y1="77.0" x2="931.5" y2="77.0" stroke="#111111" stroke-width="1"/><rect x="158.5" y="192.0" width="13" height="442.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><rect x="408.5" y="192.0" width="13" height="90.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><rect x="658.5" y="270.0" width="13" height="364.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><rect x="908.5" y="332.0" width="13" height="74.0" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><rect x="36.0" y="448.0" width="1008.0" height="222.0" fill="none" stroke="#111111" stroke-width="1.2"/><path d="M36.0 448.0 H82.0 L94.0 460.0 V472.0 H36.0 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="44.0" y="465.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111111">alt</text><line x1="36.0" y1="564.0" x2="1044.0" y2="564.0" stroke="#111111" stroke-width="1.1" stroke-dasharray="8 6"/><path d="M30.0 108.0 H287.0 L300.0 121.0 V156.0 H30.0 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><path d="M287.0 108.0 V121.0 H300.0" fill="none" stroke="#111111" stroke-width="1.2"/><text x="165.0" y="129.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle" font-weight="normal" >the booking request carries the</text><text x="165.0" y="144.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle" font-weight="normal" >quoteId the customer was shown</text><text x="290.0" y="174.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >1. GET /api/v1/pricing/quotes/{quoteId}</text><text x="290.0" y="189.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >Authorization: Bearer ...</text><line x1="171.5" y1="198.0" x2="408.5" y2="198.0" stroke="#111111" stroke-width="1.4" marker-end="url(#a)"/><text x="540.0" y="252.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >2. validate the token,</text><text x="540.0" y="267.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >then forward</text><line x1="421.5" y1="276.0" x2="658.5" y2="276.0" stroke="#111111" stroke-width="1.4" marker-end="url(#a)"/><text x="790.0" y="330.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >3. findById(quoteId)</text><line x1="671.5" y1="338.0" x2="908.5" y2="338.0" stroke="#111111" stroke-width="1.4" marker-end="url(#a)"/><text x="790.0" y="392.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >4. snapshot, or empty</text><line x1="908.5" y1="400.0" x2="671.5" y2="400.0" stroke="#111111" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#o)"/><text x="46.0" y="480.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="italic">[found and still valid]</text><text x="415.0" y="498.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >5. 200: the stored snapshot, verbatim</text><text x="415.0" y="513.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >(fee, breakdown, zones, expiresAt)</text><line x1="658.5" y1="522.0" x2="171.5" y2="522.0" stroke="#111111" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#o)"/><text x="46.0" y="586.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="italic">[unknown id, or expired]</text><text x="415.0" y="604.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >6. 404 problem+json</text><text x="415.0" y="619.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >QUOTE_NOT_FOUND</text><line x1="658.5" y1="628.0" x2="171.5" y2="628.0" stroke="#111111" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#o)"/><path d="M370.0 696.0 H697.0 L710.0 709.0 V744.0 H370.0 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><path d="M697.0 696.0 V709.0 H710.0" fill="none" stroke="#111111" stroke-width="1.2"/><text x="540.0" y="717.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle" font-weight="normal" >expired and unknown give the same answer,</text><text x="540.0" y="732.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle" font-weight="normal" >so expiry cannot be probed</text></svg>