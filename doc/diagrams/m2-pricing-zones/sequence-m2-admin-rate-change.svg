e="#111111" stroke-width="1.2"/><text x="44.0" y="433.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#111111">alt</text><line x1="36.0" y1="656.0" x2="1294.0" y2="656.0" stroke="#111111" stroke-width="1.1" stroke-dasharray="8 6"/><text x="290.0" y="110.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >1. close the card in force,</text><text x="290.0" y="125.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >publish the new price</text><line x1="171.5" y1="134.0" x2="408.5" y2="134.0" stroke="#111111" stroke-width="1.4" marker-end="url(#a)"/><text x="540.0" y="188.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >2. PUT  .../rate-cards/{id}/closure</text><text x="540.0" y="203.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >POST .../rate-cards</text><line x1="421.5" y1="212.0" x2="658.5" y2="212.0" stroke="#111111" stroke-width="1.4" marker-end="url(#a)"/><text x="790.0" y="266.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >3. forward (ADMIN role</text><text x="790.0" y="281.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >required)</text><line x1="671.5" y1="290.0" x2="908.5" y2="290.0" stroke="#111111" stroke-width="1.4" marker-end="url(#a)"/><path d="M921.5 352.0 H979.5 V382.0 H921.5" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#a)"/><text x="991.5" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="start" font-weight="normal" >4. check the new period does not</text><text x="991.5" y="375.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="start" font-weight="normal" >overlap the cards already in force</text><text x="46.0" y="448.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="italic">[no overlap]</text><text x="1040.0" y="466.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >5. UPDATE effective_to,</text><text x="1040.0" y="481.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >then INSERT the new card</text><line x1="921.5" y1="490.0" x2="1158.5" y2="490.0" stroke="#111111" stroke-width="1.4" marker-end="url(#a)"/><text x="1040.0" y="544.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >6. ok</text><line x1="1158.5" y1="552.0" x2="921.5" y2="552.0" stroke="#111111" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#o)"/><text x="665.0" y="606.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >7. 201: both periods</text><line x1="908.5" y1="614.0" x2="421.5" y2="614.0" stroke="#111111" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#o)"/><text x="46.0" y="678.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" text-anchor="start" font-weight="normal" font-style="italic">[an overlapping card exists]</text><text x="665.0" y="696.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >8. 409 problem+json</text><text x="665.0" y="711.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >RATE_CARD_OVERLAP</text><line x1="908.5" y1="720.0" x2="421.5" y2="720.0" stroke="#111111" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#o)"/><text x="290.0" y="790.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >9. the old and new periods</text><text x="290.0" y="805.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#111111" text-anchor="middle" font-weight="normal" >shown side by side</text><line x1="408.5" y1="814.0" x2="171.5" y2="814.0" stroke="#111111" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#o)"/><path d="M820.0 866.0 H1247.0 L1260.0 879.0 V914.0 H820.0 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><path d="M1247.0 866.0 V879.0 H1260.0" fill="none" stroke="#111111" stroke-width="1.2"/><text x="1040.0" y="887.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle" font-weight="normal" >the old card is closed, never deleted, and quotes already</text><text x="1040.0" y="902.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#111111" text-anchor="middle" font-weight="normal" >issued keep their fee: their Redis snapshots are untouched</text></svg>