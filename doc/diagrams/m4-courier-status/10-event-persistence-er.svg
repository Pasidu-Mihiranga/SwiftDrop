<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480"><rect width="1000" height="480" fill="white"/><rect x="20" y="20" width="310" height="176" rx="6" fill="white" stroke="#222"/><text x="175.0" y="112.08" text-anchor="middle" font-family="Arial, sans-serif" font-size="12"></text><text x="175.0" y="44.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">OUTBOX_EVENT</text><polyline points="20,56 330,56" fill="none" stroke="#222"/><text x="175.0" y="74.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">PK id : UUID</text><text x="175.0" y="92.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">aggregate_id : varchar(64), no FK</text><text x="175.0" y="110.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">event_type / topic / message_key</text><text x="175.0" y="128.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">payload : JSONB</text><text x="175.0" y="146.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">correlation_id : nullable</text><text x="175.0" y="164.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">created_at / published_at (nullable)</text><text x="175.0" y="182.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">attempts / last_error (nullable)</text><rect x="690" y="20" width="290" height="104" rx="6" fill="white" stroke="#222"/><text x="835.0" y="76.08" text-anchor="middle" font-family="Arial, sans-serif" font-size="12"></text><text x="835.0" y="44.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PROCESSED_EVENT</text><polyline points="690,56 980,56" fill="none" stroke="#222"/><text x="835.0" y="74.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">PK event_id : UUID</text><text x="835.0" y="92.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">PK consumer : varchar(100)</text><text x="835.0" y="110.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">processed_at : timestamptz</text><rect x="365" y="260" width="270" height="104" rx="6" fill="white" stroke="#222"/><text x="500.0" y="316.08" text-anchor="middle" font-family="Arial, sans-serif" font-size="12"></text><text x="500.0" y="284.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PARCEL (local)</text><polyline points="365,296 635,296" fill="none" stroke="#222"/><text x="500.0" y="314.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">PK id</text><text x="500.0" y="332.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">courier_id : nullable external user ID</text><text x="500.0" y="350.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">status / version</text><rect x="20" y="355" width="270" height="90" rx="6" fill="white" stroke="#222"/><text x="155.0" y="388.24" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">IDENTITY &amp; ACCESS</text><text x="155.0" y="404.08" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">user_profile / courier_profile</text><text x="155.0" y="419.92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">user_id = authenticated subject</text><rect x="710" y="355" width="270" height="90" rx="6" fill="white" stroke="#222"/><text x="845.0" y="388.24" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">DISPATCH &amp; WORKLOAD</text><text x="845.0" y="404.08" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">assignment: parcel_id, courier_id</text><text x="845.0" y="419.92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">source: ParcelAssigned event</text><polyline points="330,100 500,100 500,260" fill="none" stroke="#222" stroke-dasharray="4 3"/><rect x="417.628" y="142" width="164.744" height="15" fill="white"/><text x="500" 