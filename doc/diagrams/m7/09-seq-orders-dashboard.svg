tica Neue, Helvetica, Arial, sans-serif">merchant_id = claim</text><rect x="1032.1" y="462.2" width="95.7" height="21.5" fill="#ffffff"/><text x="1080.0" y="473.0" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">page of orders</text><rect x="475.2" y="508.2" width="119.6" height="21.5" fill="#ffffff"/><text x="535.0" y="519.0" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">200 page of orders</text><rect x="165.2" y="543.7" width="149.5" height="37.0" fill="#ffffff"/><text x="240.0" y="554.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">table with status chips</text><text x="240.0" y="570.0" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">and search by order ref</text><rect x="195.1" y="605.2" width="89.7" height="21.5" fill="#ffffff"/><text x="240.0" y="616.0" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Export to CSV</text><rect x="442.0" y="671.2" width="149.5" height="37.0" fill="#ffffff"/><text x="448.0" y="682.0" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">build the file from the</text><text x="448.0" y="697.5" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">same filtered results</text><rect x="177.2" y="716.3" width="125.6" height="21.5" fill="#ffffff"/><text x="240.0" y="727.1" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">download orders.csv</text><path d="M713.3 760.3 H904.7 L916.7 772.3 V819.3 H713.3 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><path d="M904.7 760.3 V772.3 H916.7" fill="none" stroke="#111111" stroke-width="1.2"/><text x="815.0" y="775.0" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">no merchant_id parameter</text><text x="815.0" y="789.8" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">exists, so merchant A cannot</text><text x="815.0" y="804.7" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">ask for merchant B&#x27;s orders</text></svg>