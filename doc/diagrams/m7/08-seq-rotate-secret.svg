ant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">button and a curl example</text><path d="M744.4 578.7 H923.7 L935.7 590.7 V622.7 H744.4 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><path d="M923.7 578.7 V590.7 H935.7" fill="none" stroke="#111111" stroke-width="1.2"/><text x="840.0" y="593.2" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">the secret is never stored</text><text x="840.0" y="608.1" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">in merchants_db or logged</text><path d="M115.1 640.7 H342.9 L354.9 652.7 V684.7 H115.1 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><path d="M342.9 640.7 V652.7 H354.9" fill="none" stroke="#111111" stroke-width="1.2"/><text x="235.0" y="655.2" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">leaving the page loses the secret:</text><text x="235.0" y="670.1" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">it can only be rotated again</text></svg>