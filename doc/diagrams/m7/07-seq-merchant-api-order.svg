2="1078.5" y2="81.0" stroke="#111111" stroke-width="1"/><rect x="1156.0" y="50" width="168" height="46" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="1240.0" y="73.0" font-size="12.5" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Kafka</text><line x1="1223.8" y1="81.0" x2="1256.2" y2="81.0" stroke="#111111" stroke-width="1"/><rect x="1366.0" y="50" width="168" height="46" fill="#ffffff" stroke="#111111" stroke-width="1.4"/><text x="1450.0" y="73.0" font-size="12.5" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">webhook-service</text><line x1="1401.5" y1="81.0" x2="1498.5" y2="81.0" stroke="#111111" stroke-width="1"/><rect x="122.3" y="104.0" width="185.4" height="37.0" fill="#ffffff"/><text x="215.0" y="114.8" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">POST /token</text><text x="215.0" y="130.3" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">grant_type=client_credentials</text><rect x="131.3" y="155.1" width="167.5" height="52.6" fill="#ffffff"/><text x="215.0" y="165.8" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">access token: merchant_id,</text><text x="215.0" y="181.3" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">MERCHANT_API, audience</text><text x="215.0" y="196.9" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">swiftdrop-api</text><rect x="125.3" y="221.6" width="179.4" height="37.0" fill="#ffffff"/><text x="215.0" y="232.4" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">POST /api/v1/merchant/orders</text><text x="215.0" y="247.9" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">(bearer, Idempotency-Key)</text><rect x="612.0" y="303.2" width="161.5" height="37.0" fill="#ffffff"/><text x="618.0" y="313.9" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">verify the JWT, apply the</text><text x="618.0" y="329.4" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">per-client rate limit</text><rect x="587.3" y="348.2" width="185.4" height="21.5" fill="#ffffff"/><text x="680.0" y="359.0" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">forward with X-Correlation-Id</text><rect x="852.0" y="406.4" width="125.6" height="52.6" fill="#ffffff"/><text x="858.0" y="417.2" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">role MERCHANT_API,</text><text x="858.0" y="432.7" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">merchant_id taken</text><text x="858.0" y="448.2" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">from the token only</text><rect x="852.0" y="475.5" width="89.7" height="37.0" fill="#ffffff"/><text x="858.0" y="486.2" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">status cache</text><text x="858.0" y="501.8" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">says APPROVED</text><rect x="852.0" y="529.0" width="161.5" height="37.0" fill="#ffffff"/><text x="858.0" y="539.8" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">no idempotency record for</text><text x="858.0" y="555.3" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">this merchant and key</text><rect x="828.3" y="574.1" width="173.5" height="21.5" fill="#ffffff"/><text x="915.0" y="584.8" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">POST /api/v1/pricing/quotes</text><rect x="861.2" y="620.1" width="107.7" height="21.5" fill="#ffffff"/><text x="915.0" y="630.8" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">fee and quote id</text><rect x="852.0" y="678.3" width="149.5" height="52.6" fill="#ffffff"/><text x="858.0" y="689.1" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">one transaction: parcel</text><text x="858.0" y="704.6" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">+ idempotency_record +</text><text x="858.0" y="720.1" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">outbox row</text><rect x="575.3" y="738.9" width="209.3" height="21.5" fill="#ffffff"/><text x="680.0" y="749.6" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">201 Created: tracking number, fee</text><rect x="843.2" y="774.4" width="143.6" height="37.0" fill="#ffffff"/><text x="915.0" y="785.2" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">outbox relay publishes</text><text x="915.0" y="800.7" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">ParcelCreated</text><rect x="1291.2" y="825.4" width="107.7" height="37.0" fill="#ffffff"/><text x="1345.0" y="836.2" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">deliver to group</text><text x="1345.0" y="851.7" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">webhook-service</text><rect x="1502.0" y="907.0" width="143.6" height="37.0" fill="#ffffff"/><text x="1508.0" y="917.7" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">sign with HMAC-SHA256,</text><text x="1508.0" y="933.3" font-size="11.5" font-weight="400" fill="#111111" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">merchant&#x27;s own secret</text><rect x="593.3" y="952.0" width="173.5" height="37.0" fill="#ffffff"/><text x="680.0" y="962.8" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">POST parcel.created webhook</text><text x="680.0" y="978.3" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">(X-SwiftDrop-Signature)</text><rect x="656.1" y="1013.5" width="47.9" height="21.5" fill="#ffffff"/><text x="680.0" y="1024.3" font-size="11.5" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">200 OK</text><path d="M128.4 1053.1 H289.6 L301.6 1065.1 V1127.1 H128.4 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><path d="M289.6 1053.1 V1065.1 H301.6" fill="none" stroke="#111111" stroke-width="1.2"/><text x="215.0" y="1067.8" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">non-2xx or timeout:</text><text x="215.0" y="1082.6" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">M8&#x27;s retry policy takes</text><text x="215.0" y="1097.5" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">over, with backoff and</text><text x="215.0" y="1112.3" font-size="11" font-weight="400" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">a dead-letter queue</text></svg>