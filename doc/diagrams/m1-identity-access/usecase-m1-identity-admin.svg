ly="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" letter-spacing="2">ADMIN ONLY · @PREAUTHORIZE(&quot;HASROLE(&#x27;ADMIN&#x27;)&quot;)</text><text x="860.0" y="199.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Sign in with e-mail / password or Google</text><text x="860.0" y="222.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">one Keycloak login for all five roles</text><text x="860.0" y="295.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Land on my role&#x27;s home page</text><text x="860.0" y="318.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">homeFor(): /admin, /admin/dispatch, /courier, /merchant, /customer</text><text x="860.0" y="391.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Be kept out of other roles&#x27; pages</text><text x="860.0" y="414.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">proxy.ts → /forbidden; APIs answer 403 / 404</text><text x="860.0" y="487.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Stay signed in</text><text x="860.0" y="510.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">silent token refresh 60 s before expiry</text><text x="860.0" y="583.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">View and edit my profile</text><text x="860.0" y="606.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">GET / PUT /api/v1/users/me</text><text x="860.0" y="689.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Sign out</text><text x="860.0" y="859.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">List couriers with vehicle, home zone and capacity</text><text x="860.0" y="882.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">GET /api/v1/admin/couriers</text><text x="860.0" y="1039.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Search users</text><text x="860.0" y="1062.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">GET /api/v1/admin/users</text><text x="860.0" y="1135.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Set the courier profile</text><text x="860.0" y="1158.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">vehicle, home zone, daily capacity</text><text x="860.0" y="1231.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Create a courier, dispatcher or admin account</text><text x="860.0" y="1254.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">POST /api/v1/admin/users</text><text x="860.0" y="1327.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Send the set-your-password e-mail</text><text x="860.0" y="1350.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Keycloak execute-actions e-mail</text><text x="860.0" y="1423.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Enable or disable a user</text><text x="860.0" y="1446.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">PATCH /api/v1/admin/users/{userId}</text><text x="860.0" y="1519.0" font-size="15" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Change a user&#x27;s roles</text><text x="860.0" y="1542.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">PATCH /api/v1/admin/users/{userId}</text><text x="150.0" y="486.0" font-size="14" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Signed-in user</text><text x="150.0" y="508.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">(any realm role)</text><text x="150.0" y="916.0" font-size="14" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Dispatcher</text><text x="150.0" y="938.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">(DISPATCHER)</text><text x="150.0" y="1326.0" font-size="14" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Admin</text><text x="150.0" y="1348.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">(ADMIN)</text><text x="162.0" y="1071.0" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">an admin can also</text><text x="162.0" y="1086.5" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">do dispatcher work</text><text x="162.0" y="651.0" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">generalisation</text><text x="874.0" y="257.0" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">«include»  after sign-in</text><text x="874.0" y="1193.0" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">«extend»  [role = COURIER]</text><text x="874.0" y="1289.0" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">«include»</text><text x="1645.0" y="1376.0" font-size="14" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Keycloak Admin API</text><text x="1645.0" y="1398.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">service account user-service-admin</text><text x="1645.0" y="200.0" font-size="14" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">Keycloak + Google</text><text x="1645.0" y="222.0" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">OIDC login, identity brokering</text></svg>