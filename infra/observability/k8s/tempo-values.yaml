# One small Tempo on the platform node. Traces arrive from Alloy.
tempo:
  retention: 24h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

nodeSelector:
  role: platform

persistence:
  enabled: true
  size: 10Gi

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 768Mi
