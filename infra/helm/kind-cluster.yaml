# kind cluster for the SwiftDrop dev install.
#
# The control-plane node is labelled ingress-ready and publishes 80/443 so the Ingress
# hosts (swiftdrop.local, api.swiftdrop.local, auth.swiftdrop.local) are reachable from the
# browser. On Docker Desktop and Colima the published ports are forwarded to localhost.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: swiftdrop
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
