# Two-node k3s layout. Apply after values-dev.yaml (and values-full.yaml when used).
#
# App pods stay on the apps node. Datastores stay on the data node. The library chart
# already reads nodeSelector; the datastore templates read the same field.
#
# Public names are under sapunipathirana.me. Each one is an A record at Namecheap
# pointing at the apps Elastic IP 52.62.242.130.

global:
  commonConfig:
    KEYCLOAK_ISSUER: https://auth.swiftdrop.sapunipathirana.me/realms/swiftdrop

ingress:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
  tls:
    enabled: true
    secretName: swiftdrop-tls
  hosts:
    web: swiftdrop.sapunipathirana.me
    api: api.swiftdrop.sapunipathirana.me
    auth: auth.swiftdrop.sapunipathirana.me
    grafana: grafana.swiftdrop.sapunipathirana.me

web:
  nodeSelector:
    role: apps
  config:
    AUTH_URL: https://swiftdrop.sapunipathirana.me
    AUTH_KEYCLOAK_ISSUER: https://auth.swiftdrop.sapunipathirana.me/realms/swiftdrop
    AUTH_KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/swiftdrop
    KEYCLOAK_PUBLIC_URL: https://auth.swiftdrop.sapunipathirana.me
api-gateway:
  nodeSelector:
    role: apps
  config:
    WEB_ORIGIN: https://swiftdrop.sapunipathirana.me
pricing-service:
  nodeSelector:
    role: apps
  config:
    MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://alloy.observability.svc.cluster.local:4318/v1/traces
user-service:
  nodeSelector:
    role: apps
merchant-service:
  nodeSelector:
    role: apps
parcel-service:
  nodeSelector:
    role: apps
  # The chart turns on an autoscaler at two replicas. On a 2 vCPU node that
  # scales up while the JVMs are still starting and the node never recovers.
  autoscaling:
    enabled: false
dispatch-service:
  nodeSelector:
    role: apps
reporting-service:
  nodeSelector:
    role: apps
tracking-service:
  nodeSelector:
    role: apps
  autoscaling:
    enabled: false
notification-service:
  nodeSelector:
    role: apps
  config:
    FRONTEND_URL: https://swiftdrop.sapunipathirana.me
webhook-service:
  nodeSelector:
    role: apps
ai-assistant-service:
  enabled: true
  nodeSelector:
    role: apps
  config:
    LLM_PROVIDER: gemini
    LLM_MODEL: gemini-3.5-flash-lite

postgres:
  nodeSelector:
    role: data
redis:
  nodeSelector:
    role: data
keycloak:
  nodeSelector:
    role: data
kafka:
  nodeSelector:
    role: data
mongodb:
  nodeSelector:
    role: data
objectStorage:
  nodeSelector:
    role: data
mailpit:
  nodeSelector:
    role: data
