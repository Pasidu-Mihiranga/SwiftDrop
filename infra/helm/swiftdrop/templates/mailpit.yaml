{{/*
Mailpit: the SMTP sink notification-service sends to in dev (mailpit:1025), with its web UI on
8025. Never enable it in production; point notification-service's SMTP_HOST at a real relay.
*/}}
{{- if .Values.mailpit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- include "swiftdrop.nodeSelector" .Values.mailpit | nindent 6 }}
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          {{- with .Values.mailpit.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
