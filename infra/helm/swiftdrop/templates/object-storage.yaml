{{/*
RustFS (S3-compatible, Apache-2.0) for proof-of-delivery photos, as in docker-compose.yml.
parcel-service reaches it at http://object-storage:9000 and creates its bucket on start-up.
The access keys come from the platform Secret (S3_ACCESS_KEY, S3_SECRET_KEY).
Production should use a managed S3 bucket and set objectStorage.enabled=false.
*/}}
{{- if .Values.objectStorage.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: object-storage
  labels:
    app.kubernetes.io/name: object-storage
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: object-storage
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: object-storage
  labels:
    app.kubernetes.io/name: object-storage
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  serviceName: object-storage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: object-storage
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-storage
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: rustfs
          image: {{ .Values.objectStorage.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.platform }}
                  key: S3_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.platform }}
                  key: S3_SECRET_KEY
            - name: RUSTFS_ADDRESS
              value: ":9000"
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.objectStorage.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.objectStorage.storage }}
{{- end }}
