{{/*
Keycloak for dev clusters, started with start-dev so a kind install needs no TLS keypair.
Production should run the Keycloak operator, or at least "start" with a real hostname and
certificate, and set keycloak.enabled=false if Keycloak is managed elsewhere.

The realm is imported from a ConfigMap created out of infra/keycloak/realm-swiftdrop.json
so the realm has exactly one source of truth in the repository. The ${KC_*_SECRET}
placeholders inside it resolve from this pod's environment, exactly as under compose.
*/}}
{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - start-dev
            {{- if .Values.keycloak.realmImport.configMapName }}
            - --import-realm
            {{- end }}
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            # Browser-facing URL, which is also the token issuer.
            - name: KC_HOSTNAME
              value: {{ printf "http://%s" .Values.ingress.hosts.auth | quote }}
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_LOG_CONSOLE_OUTPUT
              value: json
            - name: JAVA_OPTS_KC_HEAP
              value: "-XX:MaxRAMPercentage=70"
          envFrom:
            # KC_BOOTSTRAP_ADMIN_*, KC_DB_PASSWORD, the KC_*_CLIENT_SECRET placeholders the
            # realm file resolves, KC_SEED_USER_PASSWORD and the Google IdP credentials.
            - secretRef:
                name: {{ .Values.secrets.platform }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # Patient by default: Keycloak shares the node with the service JVMs, and on a
          # laptop cluster a starved instance must not be mistaken for a dead one.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: {{ .Values.keycloak.probes.startupFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            failureThreshold: {{ .Values.keycloak.probes.readinessFailureThreshold }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
            failureThreshold: {{ .Values.keycloak.probes.livenessFailureThreshold }}
          {{- if .Values.keycloak.realmImport.configMapName }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          {{- end }}
          {{- with .Values.keycloak.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.keycloak.realmImport.configMapName }}
      volumes:
        - name: realm
          configMap:
            name: {{ .Values.keycloak.realmImport.configMapName }}
      {{- end }}
{{- end }}
