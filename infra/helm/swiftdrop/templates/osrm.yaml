{{/*
OSRM road routing for same-day pricing. Same image and the same steps as docker-compose:
the init containers fetch the extract and build the graph once, and a restart reuses them.
Pricing does not depend on this being up, so nothing waits for it.
*/}}
{{- if .Values.osrm.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: osrm
  labels:
    app.kubernetes.io/name: osrm
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: osrm
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: osrm
  labels:
    app.kubernetes.io/name: osrm
    {{- include "swiftdrop.labels" . | nindent 4 }}
spec:
  serviceName: osrm
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: osrm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osrm
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: fetch
          image: {{ .Values.osrm.fetchImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              [ -f /data/map.osm.pbf ] && exit 0
              curl -fsSL -o /data/map.osm.pbf.part {{ .Values.osrm.extractUrl | quote }}
              mv /data/map.osm.pbf.part /data/map.osm.pbf
          volumeMounts:
            - name: data
              mountPath: /data
        - name: prepare
          image: {{ .Values.osrm.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              [ -f /data/map.osrm.mldgr ] && exit 0
              osrm-extract -t 2 -p /opt/car.lua /data/map.osm.pbf
              osrm-partition -t 2 /data/map.osrm
              osrm-customize -t 2 /data/map.osrm
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.osrm.prepareResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: osrm
          image: {{ .Values.osrm.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["osrm-routed", "--algorithm", "mld", "/data/map.osrm"]
          ports:
            - name: http
              containerPort: 5000
          # A route inside Colombo: it proves the graph is loaded, not just that a port is open.
          readinessProbe:
            httpGet:
              path: /route/v1/driving/79.861,6.927;79.87,6.93?overview=false
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
          {{- with .Values.osrm.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.osrm.storage }}
{{- end }}
