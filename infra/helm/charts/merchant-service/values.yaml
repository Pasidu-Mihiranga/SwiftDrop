# merchant-service values. Only what differs from the swiftdrop-service library defaults
# (infra/helm/swiftdrop-service/templates/_defaults.tpl) belongs here.
#
# Shared settings (database host, Keycloak, Kafka, Redis) come from the umbrella chart's
# global.commonConfig. Credentials come only from the Secrets named in secretRefs.

image:
  repository: swiftdrop/merchant-service

containerPort: 8082

probes:
  liveness:
    path: /actuator/health/liveness
  readiness:
    path: /actuator/health/readiness
  startup:
    path: /actuator/health/readiness
metrics:
  path: /actuator/prometheus

secretRefs: ["swiftdrop-app-secrets"]
config:
  DB_NAME: merchants_db
  DB_USER: merchant_svc
  # In-cluster Keycloak for the Admin REST API (provisioning merchant API clients)
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080
# Only the one platform key this service needs, not the whole platform Secret (which also holds
# the datastore and Keycloak bootstrap passwords).
extraEnv:
  - name: KC_MERCHANT_SERVICE_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: swiftdrop-platform-secrets
        key: KC_MERCHANT_SERVICE_CLIENT_SECRET
