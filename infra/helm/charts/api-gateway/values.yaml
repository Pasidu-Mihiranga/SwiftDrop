# api-gateway values. Only what differs from the swiftdrop-service library defaults
# (infra/helm/swiftdrop-service/templates/_defaults.tpl) belongs here.
#
# Shared settings (database host, Keycloak, Kafka, Redis) come from the umbrella chart's
# global.commonConfig. Credentials come only from the Secrets named in secretRefs.

image:
  repository: swiftdrop/api-gateway

containerPort: 8080

probes:
  liveness:
    path: /actuator/health/liveness
  readiness:
    path: /actuator/health/readiness
  startup:
    path: /actuator/health/readiness
metrics:
  path: /actuator/prometheus

secretRefs: ["swiftdrop-app-secrets"]
config:
  WEB_ORIGIN: http://web:3000
  USER_SERVICE_URL: http://user-service:8081
  MERCHANT_SERVICE_URL: http://merchant-service:8082
  PRICING_SERVICE_URL: http://pricing-service:8083
  PARCEL_SERVICE_URL: http://parcel-service:8084
  DISPATCH_SERVICE_URL: http://dispatch-service:8085
  REPORTING_SERVICE_URL: http://reporting-service:8086
  TRACKING_SERVICE_URL: http://tracking-service:8090
  TRACKING_SERVICE_WS_URL: http://tracking-service:8090
  NOTIFICATION_SERVICE_URL: http://notification-service:8091
  WEBHOOK_SERVICE_URL: http://webhook-service:8092
  AI_ASSISTANT_SERVICE_URL: http://ai-assistant-service:8095
